services:
  db:
    image: postgres:16-alpine
    container_name: btcwallet-db
    environment:
      POSTGRES_USER: btcwallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: btcwallet
    volumes:
      - btcwallet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btcwallet -d btcwallet"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btcwallet-web
    ports:
      # loopback only — Caddy terminates TLS and proxies here
      - "127.0.0.1:8810:8810"
    volumes:
      # code is baked into the image, but bind-mount app/ so edits are live
      # across `docker compose restart web` without a rebuild
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      # the wallet master key lives OUTSIDE the database on purpose:
      # a stolen DB dump alone cannot decrypt the hot wallet seed
      - ./secrets:/run/secrets:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://btcwallet:${POSTGRES_PASSWORD:?set in .env}@db:5432/btcwallet
    # lets the container reach the host's Postfix on 127.0.0.1:25 for
    # password-reset mail (mail is optional; the wallet never depends on it)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Chain watcher: credits confirmed deposits, tracks confirmations, retries
  # queued withdrawals. Separate process so it never runs twice inside gunicorn.
  syncer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btcwallet-syncer
    command: ["python", "-m", "app.sync", "--loop"]
    # The image healthcheck curls the web port, which this service does not
    # serve. Instead, check the heartbeat file the watcher writes after every
    # pass: this fails if the loop is wedged, not merely if the process died.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/syncer-heartbeat') < 300 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./secrets:/run/secrets:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://btcwallet:${POSTGRES_PASSWORD:?set in .env}@db:5432/btcwallet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  btcwallet-db:
