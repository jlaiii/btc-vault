name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, offline, no database: crypto/fee maths and a clean import of every module.
  offline:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Crypto, signing, fee maths (independent verification)
        run: python scripts/verify_crypto.py

      - name: Every module compiles
        run: python -m compileall -q app scripts

      - name: Demo stylesheet has not drifted from the app
        run: |
          if ! diff -q app/static/css/app.css docs/assets/app.css; then
            echo "::error::docs/assets/app.css is out of date — re-copy it from app/static/css/app.css"
            echo "  docker compose exec -T web python /app/scripts/build_agent_docs.py --out /tmp/docs --sync-demo-assets"
            echo "  docker cp btcwallet-web:/tmp/docs/assets/app.css docs/assets/app.css"
            exit 1
          fi

      - name: No secrets in the working tree
        run: |
          fail=0
          for f in .env secrets/master.key secrets/HOTWALLET_MNEMONIC.txt; do
            if [ -e "$f" ]; then echo "::error::$f must never be committed"; fail=1; fi
          done
          # a mnemonic is 12 or 24 lowercase words; catch obvious pastes into tracked files
          if git grep -nIE '\b(abandon|ability|able|about|above|absent|absorb|abstract|absurd)\b( \b[a-z]{3,8}\b){11,}' -- . ':!docs'; then
            echo "::error::possible recovery phrase pasted into a tracked file"; fail=1
          fi
          exit $fail

      - name: Generated docs are current
        run: |
          python scripts/build_agent_docs.py --llms-full /tmp/llms-full.txt
          test -s /tmp/llms-full.txt

  # Boots the real app against a throwaway Postgres and drives it with a test client.
  smoke:
    name: boot + behaviour smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: btcwallet
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: btcwallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U btcwallet -d btcwallet"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://btcwallet:ci-only-password@localhost:5432/btcwallet
      SECRET_KEY: ci-only-session-key-not-used-anywhere-real
      BTC_NETWORK: testnet
      COOKIE_SECURE: "0"
      AUTO_CREATE_TABLES: "1"
      SITE_URL: http://127.0.0.1:8810
      MASTER_KEY_FILE: ${{ github.workspace }}/ci-master.key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Throwaway master key (this wallet exists for the length of the job)
        run: |
          python - <<'PY'
          import base64, pathlib, secrets
          pathlib.Path("ci-master.key").write_bytes(base64.b64encode(secrets.token_bytes(32)))
          print("wrote ci-master.key")
          PY

      - name: Bootstrap the schema and exercise the app
        run: python scripts/ci_smoke.py

      - name: Show the schema drift log if it failed
        if: failure()
        run: python -c "import os; print(os.environ.get('DATABASE_URL'))" >/dev/null
