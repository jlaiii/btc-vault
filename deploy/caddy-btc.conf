
# BTC Vault — custodial Bitcoin wallet (Flask + gunicorn + Postgres, Docker,
# loopback :8810). HTTPS is mandatory here rather than a nicety: the session
# cookie is Secure, and TLS keeps 2FA codes, reset links and session tokens off
# the wire in cleartext. Public on purpose (it takes signups); every route is
# behind an account login, and admin routes additionally require 2FA plus a
# fresh password confirmation for anything that moves money.
vault.example.com {
	header {
		Strict-Transport-Security "max-age=31536000"
		X-Robots-Tag "noindex, nofollow, noarchive"
		-Server
	}
	tls {
		protocols tls1.2 tls1.3
	}
	encode zstd gzip
	reverse_proxy 127.0.0.1:8810
	# this app only ever receives small HTML forms
	request_body {
		max_size 1MB
	}
}
